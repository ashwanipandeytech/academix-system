<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Academix SaaS</title>
    <link rel="stylesheet" href="./assets/scss/main.scss">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-5">
                            <div class="bg-gradient-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                                <i class="bi bi-mortarboard-fill text-white fs-2"></i>
                            </div>
                            <h2 class="fw-bold">Academix</h2>
                            <p class="text-muted">Welcome back! Please login to your account.</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <select class="form-select" id="userRole" required>
                                    <option value="admin">Administrator</option>
                                    <option value="teacher">Teacher</option>
                                    <option value="student">Student</option>
                                    <option value="parent">Parent</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="name@school.com" value="admin@academix.com" required>
                            </div>
                            <div class="mb-4">
                                <div class="d-flex justify-content-between">
                                    <label class="form-label">Password</label>
                                    <a href="#" class="small text-primary fw-medium">Forgot password?</a>
                                </div>
                                <input type="password" class="form-control" value="password123" required>
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold bg-gradient-primary border-0">
                                Sign In
                            </button>
                        </form>

                        <div class="mt-5 text-center">
                            <p class="mb-0 text-muted">Don't have an account? <a href="#" class="text-primary fw-medium">Contact Admin</a></p>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <p class="small text-muted">&copy; 2026 Academix System. All rights reserved.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./assets/js/auth.js"></script>
</body>
</html>
