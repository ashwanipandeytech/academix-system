<div class="card shadow mb-4 border-0">
  <div class="card-header py-3 bg-white border-bottom d-flex justify-content-between align-items-center">
    <h6 class="m-0 font-weight-bold text-primary fw-bold">{{title}}</h6>
    <div class="d-flex gap-2">
      <input type="text" class="form-control form-control-sm" placeholder="Search..." [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()">
      <button class="btn btn-primary btn-sm" (click)="onAction('add', null)"><i class="bi bi-plus-lg"></i> Add New</button>
    </div>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-hover" width="100%" cellspacing="0">
        <thead class="bg-light">
          <tr>
            <th width="40px">
              <input type="checkbox" class="form-check-input" [checked]="isAllSelected" (change)="toggleAll($event)">
            </th>
            <th *ngFor="let col of columns">{{col.label}}</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of filteredData">
            <td>
              <input type="checkbox" class="form-check-input" [checked]="selectedItems.has(row)" (change)="toggleItem(row, $event)">
            </td>
            <td *ngFor="let col of columns">
              <ng-container [ngSwitch]="col.type">
                <span *ngSwitchCase="'badge'" class="badge bg-primary">{{row[col.key]}}</span>
                <span *ngSwitchCase="'date'">{{row[col.key] | date}}</span>
                <span *ngSwitchDefault>{{row[col.key]}}</span>
              </ng-container>
            </td>
            <td class="text-end">
              <button class="btn btn-outline-info btn-sm me-1" (click)="onAction('view', row)"><i class="bi bi-eye"></i></button>
              <button class="btn btn-outline-primary btn-sm me-1" (click)="onAction('edit', row)"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm" (click)="onAction('delete', row)"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
          <tr *ngIf="filteredData.length === 0">
            <td [attr.colspan]="columns.length + 2" class="text-center py-4 text-muted">
              No results found
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <span class="small text-muted">Showing {{filteredData.length}} entries</span>
      <nav aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
      </nav>
    </div>
  </div>
</div>
