<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li *ngFor="let item of items" class="breadcrumb-item" [class.active]="item.active" [attr.aria-current]="item.active ? 'page' : null">
      <a *ngIf="item.url && !item.active" [routerLink]="item.url">{{ item.label }}</a>
      <span *ngIf="!item.url || item.active">{{ item.label }}</span>
    </li>
  </ol>
</nav>
