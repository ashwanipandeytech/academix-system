<div class="row">
  <div class="col-lg-6 d-none d-lg-block bg-password-image" style="background: url('https://images.unsplash.com/photo-1516321497487-e288fb19713f?auto=format&fit=crop&w=800&q=80'); background-size: cover;"></div>
  <div class="col-lg-6">
    <div class="p-5">
      <div class="text-center">
        <h1 class="h4 text-gray-900 mb-2 fw-bold">Forgot Your Password?</h1>
        <p class="mb-4 small text-muted">We get it, stuff happens. Just enter your email address below and we'll send you a link to reset your password!</p>
      </div>
      <form class="user">
        <div class="mb-3">
          <input type="email" class="form-control form-control-user rounded-pill py-2" placeholder="Enter Email Address...">
        </div>
        <a routerLink="/erp/auth/login" class="btn btn-primary btn-user w-100 rounded-pill py-2 fw-bold">Reset Password</a>
      </form>
      <hr>
      <div class="text-center">
        <a class="small text-decoration-none" routerLink="/erp/auth/login">Already have an account? Login!</a>
      </div>
    </div>
  </div>
</div>
