<div class="row">
  <div class="col-lg-6 d-none d-lg-block bg-login-image" style="background: url('https://images.unsplash.com/photo-1523050853064-dbad350c7469?auto=format&fit=crop&w=800&q=80'); background-size: cover;"></div>
  <div class="col-lg-6">
    <div class="p-5">
      <div class="text-center">
        <h1 class="h4 text-gray-900 mb-4 fw-bold">Welcome to EduERP</h1>
      </div>
      <form class="user">
        <div class="mb-3">
          <select class="form-select form-control-user rounded-pill py-2">
            <option selected disabled>Select School</option>
            <option>Global International School</option>
            <option>Springfield Academy</option>
            <option>St. Mary's Convent</option>
          </select>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control form-control-user rounded-pill py-2" placeholder="Email Address...">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control form-control-user rounded-pill py-2" placeholder="Password">
        </div>
        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="customCheck">
            <label class="form-check-label" for="customCheck">Remember Me</label>
          </div>
        </div>
        <button type="button" (click)="onQuickLogin('admin')" class="btn btn-primary btn-user w-100 rounded-pill py-2 fw-bold">Login</button>
        
        <hr>
        
        <div class="text-center mb-3">
          <span class="small text-muted">Quick Login As:</span>
        </div>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <button type="button" (click)="onQuickLogin('admin')" class="btn btn-outline-primary btn-sm rounded-pill px-3">Admin</button>
          <button type="button" (click)="onQuickLogin('teacher')" class="btn btn-outline-info btn-sm rounded-pill px-3">Teacher</button>
          <button type="button" (click)="onQuickLogin('student')" class="btn btn-outline-success btn-sm rounded-pill px-3">Student</button>
          <button type="button" (click)="onQuickLogin('parent')" class="btn btn-outline-warning btn-sm rounded-pill px-3 text-dark">Parent</button>
        </div>
      </form>
      <hr>
      <div class="text-center">
        <a class="small text-decoration-none" routerLink="/auth/forgot-password">Forgot Password?</a>
      </div>
    </div>
  </div>
</div>
