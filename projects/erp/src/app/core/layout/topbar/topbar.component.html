<header class="topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-light border-0 d-lg-none" (click)="toggleSidebar()">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="search-box d-none d-md-block">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" placeholder="Search...">
      </div>
    </div>
  </div>

  <div class="d-flex align-items-center gap-4">
    <div class="dropdown">
      <div class="user-profile d-flex align-items-center gap-2 cursor-pointer" data-bs-toggle="dropdown">
        <div class="avatar-gradient">
          <i class="bi bi-person"></i>
        </div>
        <div class="d-none d-lg-block">
          <p class="small fw-bold mb-0">{{ currentUser()?.name }}</p>
          <p class="smaller text-muted mb-0 text-capitalize">{{ currentUser()?.role }}</p>
        </div>
      </div>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-3">
        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i> Profile</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="#" (click)="authService.logout()"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
      </ul>
    </div>
  </div>
</header>
