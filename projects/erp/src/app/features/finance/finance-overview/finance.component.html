<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold mb-0">Fees & Finance</h3>
    <p class="text-muted">Track payments and school revenue</p>
  </div>
  <button class="btn btn-primary px-4 py-2">Collect Fee</button>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light">
          <tr>
            <th class="px-4">Invoice</th>
            <th>Student</th>
            <th>Amount</th>
            <th>Status</th>
            <th class="text-end px-4">Action</th>
          </tr>
        </thead>
        <tbody>
          @for (tx of transactions(); track tx.id) {
            <tr>
              <td class="px-4 fw-medium">{{tx.id}}</td>
              <td>{{tx.student}}</td>
              <td class="fw-bold">{{tx.amount}}</td>
              <td>
                <span class="badge" [ngClass]="tx.status === 'Paid' ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'">
                  {{tx.status}}
                </span>
              </td>
              <td class="text-end px-4">
                <button class="btn btn-sm btn-light border"><i class="bi bi-printer"></i></button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
