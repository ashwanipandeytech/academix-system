<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold mb-0">Teachers Management</h3>
    <p class="text-muted">Manage your school's faculty records</p>
  </div>
  <button class="btn btn-primary px-4 py-2">
    <i class="bi bi-plus-lg me-2"></i> Add Teacher
  </button>
</div>

<div class="row g-4 mb-5">
  @for (teacher of teachers(); track teacher.id) {
    <div class="col-md-4">
      <div class="card border-0 shadow-sm text-center p-4">
        <div class="position-relative d-inline-block mx-auto mb-3">
          <img [src]="teacher.avatar" class="rounded-circle shadow-sm" style="width: 80px; height: 80px;" alt="Teacher">
          <span class="position-absolute bottom-0 end-0 badge rounded-circle p-2 border border-white border-2"
                [ngClass]="teacher.status === 'Online' ? 'bg-success' : 'bg-secondary'"></span>
        </div>
        <h5 class="fw-bold mb-1">{{teacher.name}}</h5>
        <p class="text-primary small fw-medium mb-3">{{teacher.department}}</p>
        <div class="row g-0 border-top pt-3">
          <div class="col-6 border-end">
            <p class="small text-muted mb-0">Exp</p>
            <p class="fw-bold mb-0">{{teacher.experience}}</p>
          </div>
          <div class="col-6">
            <p class="small text-muted mb-0">Classes</p>
            <p class="fw-bold mb-0">{{teacher.classes}}</p>
          </div>
        </div>
      </div>
    </div>
  }
</div>
