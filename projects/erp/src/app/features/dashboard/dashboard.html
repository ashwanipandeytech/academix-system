<div class="d-sm-flex align-items-center justify-content-between mb-4">
  <h1 class="h3 mb-0 text-gray-800 fw-bold">Dashboard Overview</h1>
  <div class="d-flex gap-2">
    <div class="input-group input-group-sm w-auto">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar3"></i></span>
      <select class="form-select form-select-sm border-start-0" aria-label="Date Range">
        <option selected>Last 30 Days</option>
        <option value="1">Last 7 Days</option>
        <option value="2">This Month</option>
        <option value="3">Last Month</option>
        <option value="4">Custom Range</option>
      </select>
    </div>
    <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
      <i class="bi bi-download me-1"></i> Generate Report
    </a>
  </div>
</div>

<!-- Content Row -->
<div class="row">
  <div class="col-xl-3 col-md-6 mb-4">
    <app-stat-card title="Total Students" value="1,280" icon="people" color="primary"></app-stat-card>
  </div>
  <div class="col-xl-3 col-md-6 mb-4">
    <app-stat-card title="Active Teachers" value="84" icon="person-badge" color="success"></app-stat-card>
  </div>
  <div class="col-xl-3 col-md-6 mb-4">
    <app-stat-card title="Revenue (Monthly)" value="$45,200" icon="cash-stack" color="info"></app-stat-card>
  </div>
  <div class="col-xl-3 col-md-6 mb-4">
    <app-stat-card title="Pending Fees" value="12" icon="exclamation-triangle" color="warning"></app-stat-card>
  </div>
</div>

<!-- Charts Row -->
<div class="row">
  <div class="col-xl-8 col-lg-7">
    <div class="card shadow mb-4 border-0">
      <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between bg-white border-bottom">
        <h6 class="m-0 font-weight-bold text-primary fw-bold">Earnings Overview</h6>
      </div>
      <div class="card-body">
        <div class="chart-area" style="position: relative; height: 300px;">
          <canvas *ngIf="isBrowser" baseChart
                  [data]="lineChartData"
                  [options]="lineChartOptions"
                  [type]="'line'">
          </canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="col-xl-4 col-lg-5">
    <div class="card shadow mb-4 border-0">
      <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between bg-white border-bottom">
        <h6 class="m-0 font-weight-bold text-primary fw-bold">Student Distribution</h6>
      </div>
      <div class="card-body">
        <div class="chart-pie pt-4 pb-2" style="position: relative; height: 260px;">
          <canvas *ngIf="isBrowser" baseChart
                  [data]="pieChartData"
                  [options]="pieChartOptions"
                  [type]="'doughnut'">
          </canvas>
        </div>
        <div class="mt-4 text-center small">
          <span class="mr-2"><i class="bi bi-circle-fill text-primary"></i> Primary</span>
          <span class="mr-2 ms-2"><i class="bi bi-circle-fill text-success"></i> Secondary</span>
          <span class="mr-2 ms-2"><i class="bi bi-circle-fill text-info"></i> Higher</span>
        </div>
      </div>
    </div>
  </div>
</div>
