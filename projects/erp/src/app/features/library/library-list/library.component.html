<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold mb-0">Library Catalog</h3>
  <button class="btn btn-primary px-4">Add Book</button>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light">
          <tr>
            <th class="px-4">Book Info</th>
            <th>Category</th>
            <th>Copies</th>
            <th>Status</th>
            <th class="text-end px-4">Action</th>
          </tr>
        </thead>
        <tbody>
          @for (book of books; track book.title) {
            <tr>
              <td class="px-4">
                <p class="mb-0 fw-bold">{{book.title}}</p>
                <p class="smaller text-muted mb-0">{{book.author}}</p>
              </td>
              <td>{{book.category}}</td>
              <td>{{book.available}} / {{book.copies}}</td>
              <td>
                @if (book.available > 0) {
                  <span class="badge bg-success-subtle text-success">Available</span>
                } @else {
                  <span class="badge bg-danger-subtle text-danger">Out of Stock</span>
                }
              </td>
              <td class="text-end px-4">
                <button class="btn btn-primary btn-sm px-3" [disabled]="book.available === 0">Issue</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
