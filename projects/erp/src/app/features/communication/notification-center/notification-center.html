<div class="d-sm-flex align-items-center justify-content-between mb-4">
  <h1 class="h3 mb-0 text-gray-800 fw-bold">Communication Management</h1>
</div>

<div class="row">
  <div class="col-12 mb-4" *ngFor="let notification of notifications">
    <div class="card border-left-{{notification.type}} shadow h-100 py-2">
      <div class="card-body">
        <div class="row no-gutters align-items-center">
          <div class="col mr-2">
            <div class="text-xs font-weight-bold text-{{notification.type}} text-uppercase mb-1">
              {{notification.sender}} - {{notification.date}}
            </div>
            <div class="h5 mb-0 font-weight-bold text-gray-800">{{notification.title}}</div>
            <div class="mt-2 text-muted">{{notification.message}}</div>
          </div>
          <div class="col-auto">
            <i class="fas fa-bell fa-2x text-gray-300"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
