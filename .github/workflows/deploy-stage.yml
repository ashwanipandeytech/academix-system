name: Deploy Stage

on:
  push:
    branches:
      - stage

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build ERP (Stage)
        run: npx ng build erp --configuration production --base-href https://academexic.demohandler.in/

      - name: Verify Build Output
        run: |
          ls -R dist/erp/browser/

      - name: Deploy ERP to Stage
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/erp/browser/"
          REMOTE_HOST: "145.79.211.128"
          REMOTE_USER: "u479097380"
          REMOTE_PORT: "65002"
          TARGET: "public_html/academexic/"
          EXCLUDE: "/.htaccess, /api/"
